services:
  peer:
    build: .
    container_name: civitas-peer
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - /opt/civitas/certs:/certs:ro
    networks:
      - civitas-net
    # Jitsi tourne aujourd'hui en natif (hors Docker) sur cette machine —
    # peer doit donc résoudre meet.civitas.local vers l'IP hôte. Adresse
    # substituée dynamiquement par Docker Compose (jamais codée en dur),
    # depuis config/civitas.env — cf. scripts/boot.sh qui l'exporte avant
    # tout docker compose up. À supprimer entièrement une fois Jitsi
    # containerisé (cf. jitsi/docker-compose.yml + PLAN_SYNCHRONISATION_ROOMS_JITSI.md,
    # §7 Containerisation Jitsi) : peer rejoindra alors directement le
    # réseau meet.jitsi et résoudra meet.civitas.local via son alias Docker,
    # sans plus jamais avoir besoin d'une IP ici.
    extra_hosts:
      - "meet.civitas.local:${CIVITAS_IP}"
    shm_size: '2gb'

networks:
  civitas-net:
    external: true
