services:
  peer:
    build: .
    container_name: civitas-peer
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    volumes:
      - /opt/civitas/certs:/certs:ro
    networks:
      - civitas-net
    # Jitsi est désormais containerisé (cf. jitsi/docker-compose.yml) : "peer"
    # résout meet.civitas.local nativement via le DNS Docker, grâce à l'alias
    # porté par le conteneur nginx (seul point qui termine le TLS attendu
    # ici, puisque peer ouvre https://meet.civitas.local) sur civitas-net.
    # Aucune IP nécessaire — l'ancien hack extra_hosts basé sur CIVITAS_IP
    # (qui pointait vers l'hôte, pour un Jitsi natif hors Docker) a été
    # retiré : il était devenu à la fois inutile et une source de dérive si
    # l'IP hôte change (cf. config/civitas.env, non versionné).
    shm_size: '2gb'

networks:
  civitas-net:
    external: true
