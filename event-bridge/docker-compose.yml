services:
  event-bridge:
    build: .
    container_name: civitas-event-bridge
    restart: unless-stopped
    ports:
      - "8100:8100"
    networks:
      - civitas-net
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP: civitas-kafka:9094

networks:
  civitas-net:
    external: true
