global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9091']

  - job_name: 'jitsi-videobridge'
    static_configs:
      - targets: ['192.168.1.89:9100']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'kafka'
    static_configs:
      # Le port 9092/9094 est le protocole Kafka natif (pas du Prometheus).
      # On scrape le kafka-exporter dédié (voir kafka/docker-compose.yml).
      - targets: ['civitas-kafka-exporter:9308']
